name: Frontend CI


on:

  push:
    branches:
      - main

    paths:
      - "frontend/**"


  pull_request:
    branches:
      - main

    paths:
      - "frontend/**"



jobs:


  lint:

    name: Lint Frontend

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: "20"

          cache: npm

          cache-dependency-path: frontend/package-lock.json



      - name: Install dependencies

        working-directory: frontend

        run: npm ci



      - name: ESLint

        working-directory: frontend

        run: npm run lint





  test:

    name: Test Frontend

    runs-on: ubuntu-latest

    needs: lint



    steps:


      - name: Checkout code

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: "20"

          cache: npm

          cache-dependency-path: frontend/package-lock.json



      - name: Install dependencies

        working-directory: frontend

        run: npm ci



      - name: Run tests

        working-directory: frontend

        run: npm run test





  build-and-push:


    name: Build and Push Frontend Image

    runs-on: ubuntu-latest


    needs: test


    if: github.ref == 'refs/heads/main'



    steps:


      - name: Checkout code

        uses: actions/checkout@v4



      - name: Docker Buildx

        uses: docker/setup-buildx-action@v3



      - name: Login Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}



      - name: Build and Push

        uses: docker/build-push-action@v6


        with:

          context: ./frontend

          file: ./frontend/Dockerfile

          push: true


          tags: |

            gabreul/condocombat-frontend:latest

            gabreul/condocombat-frontend:${{ github.sha }}